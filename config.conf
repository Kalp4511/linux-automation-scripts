# =====================================================
# Linux Automation Toolkit - Global Configuration
# =====================================================

# Disk Usage Threshold (Percentage)
# Triggers a warning if a partition exceeds this capacity
DISK_THRESHOLD=80

# Backup Configuration
# Destination folder for the backup_manager.sh archive
BACKUP_DIR="$HOME/backups"

# Logging Configuration
# Directory where toolkit.log will be stored
LOG_DIR="logs"